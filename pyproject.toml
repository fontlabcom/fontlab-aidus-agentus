# this_file: pyproject.toml
[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"
[project]
name = "fontlab-aidus-agentus"
dynamic = ["version"]
description = "Embedded FontLab ACP client and optional external AgentPool coding brain"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE", "LICENSE-3RD-PARTY.md"]
dependencies = []
[project.optional-dependencies]
brain = ["agentpool[ag-ui]==2.8.8", "pydantic-ai-slim==1.50.0", "pydantic-graph==1.50.0", "openai==2.16.0", "anthropic==0.77.0", "mistralai==1.9.11", "google-genai==1.61.0", "fontlab-remopy>=1.2.0", "mcp>=1.26,<2", "pyyaml>=6", "structlog>=25.5", "pydantic>=2.10", "pydantic-settings>=2.6", "httpx>=0.28", "aiofiles>=24.1", "ag-ui-protocol>=0.1.10,<0.2", "anyio>=4.12,<5"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "pytest-cov>=5"]
[project.scripts]
fontlab-aidus-acp = "fontlab_aidus_agentus.boot:main"
aidus-core = "fontlab_aidus_agentus.boot:main"
fontlab-aidus-install = "fontlab_aidus_agentus.install:main"
[project.urls]
Repository = "https://github.com/fontlabcom/fontlab-aidus-agentus"
[tool.hatch.version]
source = "vcs"
[tool.hatch.version.raw-options]
fallback_version = "0.1.0"
[tool.fontlab-install]
# install.vfpy: reverse-domain id (Extensions/<id>/install.log); scripts go to Scripts/.
id = "com.fontlab.aidus-agentus"
scripts = []
[tool.hatch.build.targets.wheel]
packages = ["src/fontlab_aidus_agentus"]
exclude = ["**/tests", "**/pyproject.toml", "**/__pycache__", "**/.coverage*", "**/.DS_Store"]
[tool.hatch.build.targets.wheel.force-include]
"src_docs/md/configure.md" = "fontlab_aidus_agentus/_help/configure.md"
"src_docs/md/development-and-limits.md" = "fontlab_aidus_agentus/_help/development-and-limits.md"
"src_docs/md/dock-and-acp.md" = "fontlab_aidus_agentus/_help/dock-and-acp.md"
"src_docs/md/guides/architecture.md" = "fontlab_aidus_agentus/_help/guides/architecture.md"
"src_docs/md/guides/external-agents-mcp.md" = "fontlab_aidus_agentus/_help/guides/external-agents-mcp.md"
"src_docs/md/guides/fontlab-installations.md" = "fontlab_aidus_agentus/_help/guides/fontlab-installations.md"
"src_docs/md/guides/fontlab-mcp.md" = "fontlab_aidus_agentus/_help/guides/fontlab-mcp.md"
"src_docs/md/guides/manual-tests.md" = "fontlab_aidus_agentus/_help/guides/manual-tests.md"
"src_docs/md/guides/troubleshooting.md" = "fontlab_aidus_agentus/_help/guides/troubleshooting.md"
"src_docs/md/index.md" = "fontlab_aidus_agentus/_help/index.md"
"src_docs/md/installation.md" = "fontlab_aidus_agentus/_help/installation.md"
[tool.hatch.build.targets.sdist]
# Keep repository history containing private machine paths out of distributions.
only-include = ["src", "Scripts", "run_in_fontlab", "stubs", "tests", "src_docs/md", "README.md", "CONFIGURE.md", "RELEASE.md", "DEPENDENCIES.md", "LICENSE", "LICENSE-3RD-PARTY.md", "pyproject.toml", "install.vfpy", "test.sh", "conftest.py"]
exclude = ["**/__pycache__", "**/.pytest_cache", "**/*.pyc", "**/.coverage*", "**/.DS_Store"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
[tool.coverage.run]
source = ["fontlab_aidus_agentus"]
omit = ["*/tests/*", "*/stubs/*"]
# The executor's timeout guard calls sys.settrace(None), which silences the default
# tracer for the rest of a run; sys.monitoring is unaffected. Brain/launcher tests
# start child interpreters, measured through the subprocess patch.
core = "sysmon"
patch = ["subprocess"]
[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]
