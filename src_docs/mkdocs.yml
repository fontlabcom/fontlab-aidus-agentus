# this_file: src_docs/mkdocs.yml
site_name: Aidus Agentus for FontLab
site_description: A separate AI brain and FontLab chat dock.
site_url: https://fontlabcom.github.io/fontlab-aidus-agentus/
repo_url: https://github.com/fontlabcom/fontlab-aidus-agentus
repo_name: fontlabcom/fontlab-aidus-agentus
docs_dir: md
site_dir: ../docs
use_directory_urls: true
theme:
  name: materialx
  language: en
  custom_dir: overrides
  palette:
    scheme: default
  features:
    - search.highlight
    - content.code.copy
plugins:
  - search:
      lang: [en]
markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
nav:
  - Overview: index.md
  - Installation: installation.md
  - Dock and ACP: dock-and-acp.md
  - Development and limits: development-and-limits.md
  - Configuration: configure.md
  - Guides:
      - Architecture: guides/architecture.md
      - FontLab MCP: guides/fontlab-mcp.md
      - External agents: guides/external-agents-mcp.md
      - Installation audit: guides/fontlab-installations.md
      - Manual tests: guides/manual-tests.md
      - Troubleshooting: guides/troubleshooting.md
  - Licence: licence.md
extra_css:
  - stylesheets/local.css
  - https://i.fontlab.com/fltheme26/1.0.0/components.css
  - https://i.fontlab.com/fltheme26/1.0.0/theme.css
extra_javascript:
  - https://i.fontlab.com/fltheme26/1.0.0/basecoat.js
  - https://i.fontlab.com/fltheme26/1.0.0/theme.js
hooks:
  - english_search.py
